<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>STARS Keyboard Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: calc(var(--vh, 1vh) * 100);
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
            background: #999;
            display: flex;
            flex-direction: column;
        }

        /* Viewport height handling for mobile */
        :root {
            --vh: 1vh;
        }

        /* Entry Controls */
        #entry-controls {
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 8px;
            background: #444;
            color: #fff;
            font-family: monospace;
            padding-top: 12px;
            flex-wrap: wrap;
        }

        #entry-prompt {
            font-size: 1.2em;
            flex: 1;
            min-width: 200px;
        }

        #hint-text {
            font-size: 1em;
            color: #ff0;
            min-width: 6em;
        }

        #completion-counter {
            color: #fff;
            font-size: 1em;
        }

        #connection-status {
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
        }

        #connection-status.connected {
            background: #228B22;
            color: #fff;
        }

        #connection-status.disconnected {
            background: #B22222;
            color: #fff;
        }

        #connection-status.connecting {
            background: #FFA500;
            color: #000;
        }

        /* Terminal */
        .terminal {
            font-family: monospace;
            font-size: clamp(14px, 1.4vw, 20px);
            line-height: 1.2em;
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 0 0 5px 5px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            min-height: 120px;
        }

        .term-content {
            height: calc(1.2em * 5);
            line-height: 1.2em;
            overflow-y: auto;
            white-space: pre-wrap;
            flex: 1;
            margin-bottom: 8px;
        }

        .entry-controls {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .send-btn, .clear-btn {
            font-family: monospace;
            font-size: 0.9em;
            padding: 4px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn {
            background: #228B22;
            color: #fff;
        }

        .send-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            background: #32CD32;
        }

        .clear-btn {
            background: #B22222;
            color: #fff;
        }

        .clear-btn:hover {
            background: #DC143C;
        }

        /* Keyboard Layout */
        .keyboard {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(7, 1fr);
            margin: clamp(4px, 1vw, 12px);
            gap: clamp(2px, 0.6vw, 6px);
        }

        .key {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            font-size: clamp(14px, 2vw, 24px);
            padding: .3em;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .key[data-key="*"] {
            font-size: clamp(24px, 4vw, 50px);
        }

        .key:disabled {
            opacity: .3;
            filter: grayscale(100%) brightness(80%);
            cursor: not-allowed;
            border: 1px dashed rgba(0, 0, 0, 0.3);
        }

        .key.active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .key.flash {
            animation: keyFlash 0.2s ease;
        }

        @keyframes keyFlash {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            100% { transform: scale(1); }
        }

        .no-emoji {
            font-family: monospace !important;
            font-variant-ligatures: none;
            font-feature-settings: "liga" 0;
            font-size: 1.5em;
        }

        /* Key Colors */
        .yellow {
            background: #FFD700;
            color: #000;
        }

        .yellow:hover:not(:disabled) {
            background: #FFF700;
        }

        .green {
            background: #228B22;
            color: #fff;
        }

        .green:hover:not(:disabled) {
            background: #32CD32;
        }

        .red {
            background: #B22222;
            color: #fff;
        }

        .red:hover:not(:disabled) {
            background: #DC143C;
        }

        .blue {
            background: #1E90FF;
            color: #fff;
        }

        .blue:hover:not(:disabled) {
            background: #4169E1;
        }

        /* Message styling */
        .success-message { color: #32CD32 !important; }
        .error-message { color: #FF6B6B !important; }
        .info-message { color: #4ECDC4 !important; }
        .key.highlighted { 
            box-shadow: 0 0 10px #FFD700, inset 0 0 10px rgba(255, 215, 0, 0.3) !important;
            border: 2px solid #FFD700 !important;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #entry-controls {
                flex-direction: column;
                gap: 0.5em;
                align-items: stretch;
            }
            
            #entry-prompt {
                text-align: center;
            }
            
            .terminal {
                min-height: 80px;
            }
            
            .term-content {
                height: calc(1.2em * 3);
            }
        }
    </style>
</head>
<body>
    <!-- Flight Plan Entry Controls -->
    <div id="entry-controls">
        <button id="btn-mode">Flight Plan Mode</button>
        <div id="entry-prompt">Ready for Flight Plan Entry</div>
        <div id="hint-text"></div>
        <div id="completion-counter">
            Entries Sent: <span id="entry-count">0</span>
        </div>
        <div id="connection-status" class="disconnected">
            FDIO: Disconnected
        </div>
    </div>

    <!-- Terminal Display -->
    <div class="terminal">
        <div id="term-content" class="term-content"></div>
        <div class="entry-controls">
            <button id="btn-clear-entry" class="clear-btn">CLEAR ENTRY</button>
        </div>
    </div>

    <!-- STARS Keyboard Layout -->
    <div class="keyboard">
        <!-- Row 1 -->
        <button id="btn-clear" class="key yellow" data-clickable>CLEAR</button>
        <button id="btn-backspace" class="key yellow" data-clickable>BACK SPACE</button>
        <button id="btn-space" class="key yellow" data-clickable style="grid-column:3/9">SPACE</button>
        <button id="btn-enter" class="key red" data-clickable style="grid-column:9/11">ENTER</button>
        <!-- Row 2 -->
        <button class="key green" disabled>INIT CNTL</button>
        <button class="key green" disabled>TRK<br>RPOS</button>
        <button class="key green" disabled>TRK<br>SUSP</button>
        <button class="key green" disabled>TERM<br>CNTL</button>
        <button class="key green" disabled>HND<br>OFF</button>
        <button class="key green" disabled>FLT<br>DATA</button>
        <button class="key green" disabled>MULTI<br>FUNC</button>
        <button class="key green" disabled>F8</button>
        <button class="key yellow" data-key="^" data-clickable>&#9651;</button>
        <button class="key yellow" data-key="●" data-clickable>&#9679;</button>
        <!-- Row 3 -->
        <button class="key green" disabled>F9</button>
        <button class="key green" disabled>F10</button>
        <button class="key green" disabled>CA</button>
        <button class="key green" disabled>F12</button>
        <button class="key green" disabled>F13</button>
        <button class="key green" disabled>F14</button>
        <button class="key green" disabled>TGT<br>GEN</button>
        <button class="key green" disabled>F16</button>
        <button class="key yellow" data-key="+" data-clickable>IFR<br>+</button>
        <button class="key yellow" disabled>VFR /</button>
        <!-- Row 4 -->
        <button class="key yellow" data-key="A" data-clickable data-qwerty="a">A</button>
        <button class="key yellow" data-key="B" data-clickable data-qwerty="b">BCN<br>B</button>
        <button class="key yellow" data-key="C" data-clickable data-qwerty="c">CFG<br>C</button>
        <button class="key yellow" data-key="D" data-clickable data-qwerty="d">DIS<br>D</button>
        <button class="key yellow" data-key="E" data-clickable data-qwerty="e">EMG<br>E</button>
        <button class="key yellow" data-key="F" data-clickable data-qwerty="f">FIL<br>F</button>
        <button class="key yellow" data-key="G" data-clickable data-qwerty="g">G</button>
        <button class="key blue" data-key="1" data-clickable data-qwerty="1"><span class="no-emoji">&#8598;</span> 1</button>
        <button class="key blue" data-key="2" data-clickable data-qwerty="2">&#8593; 2</button>
        <button class="key blue" data-key="3" data-clickable data-qwerty="3"><span class="no-emoji">&#8599;</span> 3</button>
        <!-- Row 5 -->
        <button class="key yellow" data-key="H" data-clickable data-qwerty="h">H</button>
        <button class="key yellow" data-key="I" data-clickable data-qwerty="i">I</button>
        <button class="key yellow" data-key="K" data-clickable data-qwerty="k">K</button>
        <button class="key yellow" data-key="J" data-clickable data-qwerty="j">J</button>
        <button class="key yellow" data-key="L" data-clickable data-qwerty="l">LDR<br>L</button>
        <button class="key yellow" data-key="M" data-clickable data-qwerty="m">MOD<br>M</button>
        <button class="key yellow" data-key="N" data-clickable data-qwerty="n">N</button>
        <button class="key blue" data-key="4" data-clickable data-qwerty="4">&#8592; 4</button>
        <button class="key blue" data-key="5" data-clickable data-qwerty="5">5</button>
        <button class="key blue" data-key="6" data-clickable data-qwerty="6">&#8594; 6</button>
        <!-- Row 6 -->
        <button class="key yellow" data-key="O" data-clickable data-qwerty="o">OFF<br>O</button>
        <button class="key yellow" data-key="P" data-clickable data-qwerty="p">PRE<br>P</button>
        <button class="key yellow" data-key="Q" data-clickable data-qwerty="q">Q</button>
        <button class="key yellow" data-key="R" data-clickable data-qwerty="r">R</button>
        <button class="key yellow" data-key="S" data-clickable data-qwerty="s">SYS<br>S</button>
        <button class="key yellow" data-key="T" data-clickable data-qwerty="t">TAB<br>T</button>
        <button class="key yellow" data-key="U" data-clickable data-qwerty="u">U</button>
        <button class="key blue" data-key="7" data-clickable data-qwerty="7"><span class="no-emoji">&#8601;</span> 7</button>
        <button class="key blue" data-key="8" data-clickable data-qwerty="8">&#8595; 8</button>
        <button class="key blue" data-key="9" data-clickable data-qwerty="9"><span class="no-emoji">&#8600;</span> 9</button>
        <!-- Row 7 -->
        <button class="key yellow" data-key="V" data-clickable data-qwerty="v">V</button>
        <button class="key yellow" data-key="W" data-clickable data-qwerty="w">W</button>
        <button class="key yellow" data-key="X" data-clickable data-qwerty="x">X</button>
        <button class="key yellow" data-key="Y" data-clickable data-qwerty="y">Y</button>
        <button class="key yellow" data-key="Z" data-clickable data-qwerty="z">Z</button>
        <button class="key yellow" data-key="*" data-clickable data-qwerty="8">*</button>
        <button class="key yellow" disabled>MIN</button>
        <button class="key blue" data-key="0" data-clickable data-qwerty="0" style="grid-column:8/11">0</button>
    </div>

    <script>
        // Viewport height setup
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);

        // Application state
        let content = '';
        let isConnected = false;
        let entriesSent = 0;
        let mode = 'flightplan';

        // DOM elements
        const elements = {
            termContent: document.getElementById('term-content'),
            enterBtn: document.getElementById('btn-enter'),
            clearBtn: document.getElementById('btn-clear-entry'),
            modeBtn: document.getElementById('btn-mode'),
            promptEl: document.getElementById('entry-prompt'),
            hintEl: document.getElementById('hint-text'),
            entryCountEl: document.getElementById('entry-count'),
            connectionStatusEl: document.getElementById('connection-status')
        };

        // Key button mapping
        const keyButtons = new Map();
        
        // Initialize keyboard
        function initKeyboard() {
            document.querySelectorAll('.key').forEach(btn => {
                const key = btn.getAttribute('data-key');
                const qwerty = btn.getAttribute('data-qwerty');
                
                if (key) {
                    keyButtons.set(key, btn);
                }
                
                if (qwerty) {
                    keyButtons.set(qwerty.toLowerCase(), btn);
                }

                // Handle on-screen button clicks
                if (btn.hasAttribute('data-clickable')) {
                    btn.addEventListener('click', () => handleKeyPress(btn));
                }
            });

            // Setup special buttons
            keyButtons.set('clear', document.getElementById('btn-clear'));
            keyButtons.set('backspace', document.getElementById('btn-backspace'));
            keyButtons.set('space', document.getElementById('btn-space'));
            keyButtons.set('enter', document.getElementById('btn-enter'));
        }

        // Handle key press
        function handleKeyPress(button) {
            let key = null;

            if (button.id === 'btn-clear') {
                key = 'CLEAR';
            } else if (button.id === 'btn-backspace') {
                key = 'BACKSPACE';
            } else if (button.id === 'btn-space') {
                key = 'SPACE';
            } else if (button.id === 'btn-enter') {
                key = 'ENTER';
            } else {
                key = button.getAttribute('data-key');
            }

            if (key) {
                flashKey(button);
                if (key === 'ENTER') {
                    sendToFDIO();
                } else {
                    processKeyInput(key);
                }
            }
        }

        // Process key input
        function processKeyInput(key) {
            switch (key) {
                case 'CLEAR':
                    content = '';
                    break;
                case 'BACKSPACE':
                    content = content.slice(0, -1);
                    break;
                case 'SPACE':
                    content += '\n';
                    break;
                default:
                    content += key;
                    break;
            }

            updateDisplay();
            updateEnterButton();
        }

        // Flash key for visual feedback
        function flashKey(button) {
            if (!button) return;
            button.classList.add('flash');
            setTimeout(() => {
                button.classList.remove('flash');
            }, 200);
        }

        // Update terminal display
        function updateDisplay() {
            elements.termContent.textContent = content;
            elements.termContent.scrollTop = elements.termContent.scrollHeight;
        }

        // Handle physical keyboard
        document.addEventListener('keydown', (e) => {
            let starsKey = null;
            let button = null;

            // Handle special key combinations
            if (e.key === '8' && e.shiftKey) {
                starsKey = '*';
                button = keyButtons.get('*');
            } else if (e.key === '=' && e.shiftKey) {
                starsKey = '+';
                button = keyButtons.get('+');
            } else if (e.key === '6' && e.shiftKey) {
                starsKey = '^';
                button = keyButtons.get('^');
            } else if (e.key === ' ') {
                e.preventDefault();
                starsKey = 'SPACE';
                button = keyButtons.get('space');
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                starsKey = 'BACKSPACE';
                button = keyButtons.get('backspace');
            } else if (e.key === 'Delete') {
                e.preventDefault();
                starsKey = 'CLEAR';
                button = keyButtons.get('clear');
            } else if (e.key === 'Enter') {
                e.preventDefault();
                starsKey = 'ENTER';
                button = keyButtons.get('enter');
            } else if (e.key === 'Escape') {
                e.preventDefault();
                starsKey = 'CLEAR';
                button = keyButtons.get('clear');
            } else if (/^[a-zA-Z0-9]$/.test(e.key)) {
                e.preventDefault();
                const normalizedKey = e.key.toUpperCase();
                starsKey = normalizedKey;
                button = keyButtons.get(normalizedKey) || keyButtons.get(e.key.toLowerCase());
            }

            if (button && starsKey) {
                flashKey(button);
                if (starsKey === 'ENTER') {
                    sendToFDIO();
                } else if (starsKey === 'CLEAR') {
                    clearEntry();
                } else {
                    processKeyInput(starsKey);
                }
            }
        });

        // FDIO communication
        async function checkConnection() {
            try {
                const response = await fetch('http://localhost:3001/health', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    isConnected = true;
                    updateConnectionStatus('connected');
                    return true;
                }
            } catch (error) {
                isConnected = false;
                updateConnectionStatus('disconnected');
                return false;
            }
        }

        async function sendToFDIO() {
            const message = content.split('\n').join(' ').replace(/\s+/g, ' ').trim();
            
            if (!message) {
                showMessage('No entry to send', 'error');
                return;
            }

            if (!isConnected) {
                showMessage('FDIO not connected', 'error');
                return;
            }

            try {
                // Disable ENTER button during send
                elements.enterBtn.disabled = true;
                elements.enterBtn.textContent = 'SENDING...';
                
                const response = await fetch('http://localhost:3001/stars/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                if (data.success) {
                    entriesSent++;
                    elements.entryCountEl.textContent = entriesSent.toString();
                    
                    const fp = data.flightPlan;
                    const info = data.starsInfo;
                    
                    showMessage(`✅ ${info.type} ${info.rule} flight plan created: ${fp.aircraftID} (${fp.beaconCode})`, 'success');
                    
                    // Clear entry after successful send
                    content = '';
                    updateDisplay();
                } else {
                    showMessage(`❌ Error: ${data.error}`, 'error');
                }
                
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            } finally {
                elements.enterBtn.disabled = false;
                elements.enterBtn.textContent = 'ENTER';
                updateEnterButton();
            }
        }

        function clearEntry() {
            content = '';
            updateDisplay();
            updateEnterButton();
            showMessage('Entry cleared', 'info');
        }

        function updateConnectionStatus(status) {
            elements.connectionStatusEl.textContent = status === 'connected' ? 'FDIO: Connected' : 'FDIO: Disconnected';
            elements.connectionStatusEl.classList.remove('connected', 'disconnected', 'connecting');
            elements.connectionStatusEl.classList.add(status);
        }

        function updateEnterButton() {
            const hasContent = content.trim().length > 0;
            elements.enterBtn.disabled = !hasContent || !isConnected;
        }

        function showMessage(message, type = 'info', duration = 3000) {
            const originalText = elements.promptEl.textContent;
            
            elements.promptEl.textContent = message;
            elements.promptEl.className = type + '-message';
            
            setTimeout(() => {
                elements.promptEl.textContent = originalText;
                elements.promptEl.className = '';
            }, duration);
        }

        // Event listeners
        elements.clearBtn.addEventListener('click', clearEntry);
        elements.modeBtn.addEventListener('click', () => {
            if (mode === 'flightplan') {
                mode = 'practice';
                elements.modeBtn.textContent = 'Flight Plan Mode';
                elements.promptEl.textContent = 'Practice Mode - Enter flight plans for training';
            } else {
                mode = 'flightplan';
                elements.modeBtn.textContent = 'Practice Mode';
                elements.promptEl.textContent = 'Ready for Flight Plan Entry';
            }
        });

        // Initialize
        initKeyboard();
        updateEnterButton();
        updateConnectionStatus('disconnected');

        // Check connection periodically
        checkConnection();
        setInterval(checkConnection, 10000);

        console.log('🚀 STARS Keyboard Simulator (Standalone) initialized');
    </script>
</body>
</html>
